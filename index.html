<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>:: Day6 팬메이드 게임 ::</title>
    <link rel="shortcut icon " href="assets/index/favicon.ico">
    <link rel="icon" href="assets/index/favicon.ico">

    <style>
    @font-face{
        font-family: 'galmuri';
        src: url('assets/index/Galmuri11.ttf') format('truetype');
        font-weight: normal;
    }

    @font-face{
        font-family: 'galmuri';
        src: url('assets/index/Galmuri11-Bold.ttf') format('truetype');
        font-weight: bold;
    }

    :root {
      --background : #FFF6BF;
      --text : #625f4e;
      --box1 : #FFEBAD;
      --box2 : #ABD9FF;
      --box3 : #C3F8FF;
      --shadow : #22222246;
    }

    body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10%;

        font-family: 'galmuri';
        color: var(--text);
        background-color: var(--background);
        
        position: relative; /* 추가 */
        z-index: 0;         /* 추가 */
    }
    video {
        position: fixed;   /* 화면 고정 */
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* 비율 유지하며 꽉 채우기 */
        z-index: -1;       /* 뒤로 보내기 */
        filter: brightness(0.9); /* 필요하면 조금 어둡게 */
    }

    h1 {
        position: relative;
        z-index: 1;

        margin: 2dvh auto 2dvh auto;
        font-size: 1.8rem;
        text-align: center;
    }
    
    .grid-container {
        position: relative;
        z-index: 1;

        display: grid;
        grid-auto-columns: 50%;
        grid-auto-rows: 50%;
        grid-template-areas:
            "box-1 box-1"
            "box-2 box-3";
    }

    .box {
        margin: 0.5em;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        text-decoration: none;
        border-radius: 12px;
        transition: 500ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .box:hover {
        transform: scale(1.05);
    }

    .box div {
        display: flex;
        flex-direction: column;
        margin: 15px;
        min-height: 120px;
    }

    .box div .title {
        margin: 0;
        padding: 2px 5px;
        border-radius: 2px;
        align-self: flex-start;
        color: var(--text);
        font-size: 0.8rem;
        word-break: keep-all;
        background-color: #FFEBAD;
    }

    .notice {
        position: relative;
        z-index: 1;

        margin: 3dvh auto 8dvh auto;
    }
    
    .notice p {
        font-size: 0.6rem;
    }
    </style>
</head>
<body>
    <video src="assets/index/background.mp4" muted autoplay loop></video>
    <h1><span style="font-family: 'Apple Symbols', 'Segoe UI Symbol', 'Noto Sans Symbols', 'Symbola', sans-serif;">🐕</span>.<br>Day6 팬메이드 게임</h1>
    <div class="grid-container">
        <a class="box" style="grid-area: box-1; background-image: url('assets/index/luckystore.jpg');" href="https://day6-luckystore.pages.dev/">
            <div>
                <p class="title">행운상점 타이쿤</p>
            </div>
        </a>
        <a class="box" style="grid-area: box-2; background-image: url('assets/index/denimals-puzzle.jpg');" href="https://callthefront3.itch.io/denimals-puzzle">
            <div>
                <p class="title">데니멀즈를<br>조합해라!</p>
            </div>
        </a>
        <a class="box" style="grid-area: box-3; background-image: url('assets/index/typingpractice.jpg');" href="/Day6TypingPractice.html">
            <div>
                <p class="title">데식타자연습</p>
            </div>
        </a>
    </div>
    <div class="notice">
        <p>본 게임들은 비상업적 목적으로 제작되었으며, 어떠한 상업적 이득을 추구하지 않습니다. 모든 캐릭터와 이미지는 팬 창작 활동의 일환으로 사용되었으며, 특정 인물이나 단체와의 연관성을 주장하지 않습니다.</p>
        <p style="text-align: center;">Made by <a href="https://x.com/callthefront3/">@callthefront3</a>ㅤ | ㅤ<a href="mailto:callthefront3@gmail.com ?subject=[데이식스 팬게임 관련 문의] ">제작자 메일로 문의하기</a> </p>
    </div>
</body>
</html>
