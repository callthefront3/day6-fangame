<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>:: Day6 팬메이드 게임 ::</title>
    <link rel="shortcut icon " href="assets/index/favicon.ico">
    <link rel="icon" href="assets/index/favicon.ico">

    <style>
    @font-face{
        font-family: 'galmuri';
        src: url('assets/index/Galmuri11.ttf') format('truetype');
        font-weight: normal;
    }

    @font-face{
        font-family: 'galmuri';
        src: url('assets/index/Galmuri11-Bold.ttf') format('truetype');
        font-weight: bold;
    }

    :root {
      --background : #FFF6BF;
      --text : #625f4e;
      --box1 : #FFEBAD;
      --box2 : #ABD9FF;
      --box3 : #C3F8FF;
      --shadow : #22222246;
    }

    body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 10%;

        font-family: 'galmuri';
        color: var(--text);
        background-color: var(--background);
    }

    h1 {
        margin: 2dvh auto 2dvh auto;
        font-size: 1.8rem;
        text-align: center;
    }
    
    .grid-container {
        display: grid;
        grid-auto-columns: 50%;
        grid-auto-rows: 50%;
        gap: 1em;
        grid-template-areas:
            "box-1 box-1"
            "box-2 box-3";
        transform: scaleX(0.9);
    }

    .box {
        position: relative;
        padding: 30px;
        min-height: 200px;
        display: flex;
        background-size: cover;
        background-position: center;
        cursor: pointer;
        text-decoration: none;
        border-radius: 12px;
        transition: 500ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .box:hover {
        transform: scale(1.05);
    }

    .box .title {
        align-self: flex-end;
        color: var(--text);
        font-size: 1rem;
        word-break: keep-all;
        background-color: #FFEBAD;
        padding: 1px 3px;
    }

    .notice {
        margin: 3dvh auto 8dvh auto;
    }
    
    .notice p {
        font-size: 0.6rem;
    }
    </style>
</head>
<body>
    <h1><span style="font-family: 'Apple Symbols', 'Segoe UI Symbol', 'Noto Sans Symbols', 'Symbola', sans-serif;">🐕</span>.<br>Day6 팬메이드 게임</h1>
    <div class="grid-container">
        <a class="box" style="grid-area: box-1; background-image: url('assets/index/luckystore.jpg');" href="https://day6-luckystore.pages.dev/">
            <div class="title">행운상점 타이쿤</div>
        </a>
        <a class="box" style="grid-area: box-2; background-image: url('assets/index/denimals-puzzle.jpg');" href="https://callthefront3.itch.io/denimals-puzzle">
            <div class="title">데니멀즈를 조합해라!</div>
        </a>
        <a class="box" style="grid-area: box-3; background-image: url('assets/index/typingpractice.jpg');" href="/Day6TypingPractice.html">
            <div class="title">데식타자연습</div>
        </a>
    </div>
    <div class="notice">
        <p>본 게임들은 비상업적 목적으로 제작되었으며, 어떠한 상업적 이득을 추구하지 않습니다. 모든 캐릭터와 이미지는 팬 창작 활동의 일환으로 사용되었으며, 특정 인물이나 단체와의 연관성을 주장하지 않습니다.</p>

    </div>
</body>
</html>
